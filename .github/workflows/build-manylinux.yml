name: build-manylinux

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g., 0.1.0)"
        required: true
        type: string
      llvm_cache_mode:
        description: "LLVM cache mode: cache reuses a ready install, incremental keeps the build dir, clean deletes it first."
        required: false
        default: incremental
        type: choice
        options:
          - cache
          - incremental
          - clean
  schedule:
    # 02:30 Asia/Shanghai every day, after the downstream 02:00 Renovate check.
    - cron: '30 18 * * *'

permissions:
  contents: write

concurrency:
  group: buddy-mlir-release
  cancel-in-progress: false

jobs:
  check_nightly:
    runs-on: ubuntu-22.04
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for new commits
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          SHOULD_RELEASE="true"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATEST_NIGHTLY_TAG="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq 'map(select(.draft == false and (.tag_name | startswith("nightly/"))))[0].tag_name // empty')"
          if [ -n "${LATEST_NIGHTLY_TAG}" ]; then
            LATEST_NIGHTLY_SHA="$(git rev-list -n 1 "${LATEST_NIGHTLY_TAG}")"
            CURRENT_SHA="$(git rev-parse HEAD)"
            if [ "${LATEST_NIGHTLY_SHA}" = "${CURRENT_SHA}" ]; then
              echo "No commits since ${LATEST_NIGHTLY_TAG}; skipping nightly release."
              SHOULD_RELEASE="false"
            fi
          fi
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"

  prepare_release:
    needs: check_nightly
    if: ${{ needs.check_nightly.outputs.should_release == 'true' }}
    runs-on: ubuntu-22.04
    outputs:
      tag_name: ${{ steps.vars.outputs.tag_name }}
      name: ${{ steps.vars.outputs.name }}
      version: ${{ steps.vars.outputs.version }}
      llvm_cache_mode: ${{ steps.vars.outputs.llvm_cache_mode }}
      is_nightly: ${{ steps.vars.outputs.is_nightly }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare variables
        id: vars
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # trigger by hand
            VERSION="${{ inputs.version }}"
            NAME="BUDDY MLIR ${VERSION}"
            TAG_NAME="release/v${VERSION}"
            CACHE_MODE="${{ inputs.llvm_cache_mode }}"
            IS_NIGHTLY="false"
          else
            # trigger by schedule
            # Keep the GitHub tag distinct from the package version: the tag
            # uses a leading v, while PEP 440 package versions do not.
            DATE=$(TZ=Asia/Shanghai date +'%Y%m%d')
            VERSION="0.1.0.dev${DATE}"
            NAME="Nightly ${VERSION}"
            TAG_NAME="nightly/v${VERSION}"
            CACHE_MODE="incremental"
            IS_NIGHTLY="true"
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "llvm_cache_mode=$CACHE_MODE" >> "$GITHUB_OUTPUT"
          echo "is_nightly=$IS_NIGHTLY" >> "$GITHUB_OUTPUT"

      - name: Create or Update release page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.name }}
          # Keep releases as drafts while the matrix uploads all artifacts.
          # publish_nightly makes a successful nightly visible afterwards.
          draft: true
          append_body: false
          overwrite_files: true
          prerelease: ${{ steps.vars.outputs.is_nightly == 'true' }}
          make_latest: ${{ steps.vars.outputs.is_nightly != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wheel:
    needs: prepare_release
    name: Build (${{ matrix.arch }}, py${{ matrix.python }})
    timeout-minutes: 360
    continue-on-error: false

    concurrency:
      group: buddy-mlir-manylinux-${{ matrix.arch }}-py${{ matrix.python }}-${{ needs.prepare_release.outputs.tag_name }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        arch: [x64, riscv64]
        python: ["3.12"]
        include:
          - arch: x64
            target_arch: x86_64
          - arch: riscv64
            target_arch: riscv64

    runs-on:
      - self-hosted-docker
      - ${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'false'

      - name: Prepare variables
        id: vars
        run: |
          set -euo pipefail
          PY_VER="${{ matrix.python }}"
          PY_NODOT="${PY_VER//./}"
          PY_TAG="cp${PY_NODOT}"
          PY_WHEEL_TAG="${PY_TAG}-abi3"
          BUDDY_HASH="$(git rev-parse HEAD)"
          echo "py_tag=${PY_TAG}" >> "$GITHUB_OUTPUT"
          echo "py_wheel_tag=${PY_WHEEL_TAG}" >> "$GITHUB_OUTPUT"
          echo "buddy_hash=${BUDDY_HASH}" >> "$GITHUB_OUTPUT"
          if [[ "${{ matrix.target_arch }}" == "riscv64" ]]; then
            echo "host_build_dir=/data/runner/workspace/buddy-mlir-release" >> "$GITHUB_OUTPUT"
            echo "llvm_src=/data/runner/workspace/llvm-project" >> "$GITHUB_OUTPUT"
          else
            echo "host_build_dir=$HOME/actions-runner/workspace/buddy-mlir-release" >> "$GITHUB_OUTPUT"
            echo "llvm_src=$HOME/actions-runner/workspace/llvm-project" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout LLVM source
        id: setup-llvm
        uses: ./.github/actions/checkout_llvm
        with:
          llvm-src: ${{ steps.vars.outputs.llvm_src }}

      - name: Build manylinux wheel in container
        run: |
          set -euo pipefail
          export LLVM_CACHE_MODE="${{ needs.prepare_release.outputs.llvm_cache_mode }}"
          export HOST_LLVM_SRC="${{ steps.vars.outputs.llvm_src }}"
          export HOST_BUILD_DIR="${{ steps.vars.outputs.host_build_dir }}"
          ./scripts/release.sh "${{ steps.vars.outputs.py_tag }}" "${{ needs.prepare_release.outputs.version }}" "${{ matrix.target_arch }}"

      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ needs.prepare_release.outputs.tag_name }}" \
            ${{ steps.vars.outputs.host_build_dir }}/${{ matrix.target_arch }}/buddy/${{ steps.vars.outputs.py_wheel_tag }}/${{ steps.vars.outputs.buddy_hash }}/target/buddy-${{ needs.prepare_release.outputs.version }}-${{ steps.vars.outputs.py_wheel_tag }}-manylinux* \
            ${{ steps.vars.outputs.host_build_dir }}/${{ matrix.target_arch }}/buddy/${{ steps.vars.outputs.py_wheel_tag }}/${{ steps.vars.outputs.buddy_hash }}/target/llvm-*-${{ steps.vars.outputs.py_wheel_tag }}-manylinux* \
            --clobber

      - name: Upload buddy-cli
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BUDDY_BUILD_DIR=${{ steps.vars.outputs.host_build_dir }}/${{ matrix.target_arch }}/buddy/${{ steps.vars.outputs.py_wheel_tag }}/${{ steps.vars.outputs.buddy_hash }}
          cp -a "${BUDDY_BUILD_DIR}/dist/bin/buddy-cli" "${BUDDY_BUILD_DIR}/target/buddy-cli-${{ needs.prepare_release.outputs.version }}.${{ matrix.target_arch }}"
          gh release upload "${{ needs.prepare_release.outputs.tag_name }}" \
            "${BUDDY_BUILD_DIR}/target/buddy-cli-${{ needs.prepare_release.outputs.version }}.${{ matrix.target_arch }}" \
            --clobber

  publish_nightly:
    needs: [prepare_release, wheel]
    if: ${{ needs.prepare_release.outputs.is_nightly == 'true' && needs.wheel.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Publish complete nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "${{ needs.prepare_release.outputs.tag_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --prerelease \
            --latest=false
