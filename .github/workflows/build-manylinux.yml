name: build-manylinux

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump for a manual release"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      llvm_cache_mode:
        description: "LLVM cache mode: cache reuses a ready install, incremental keeps the build dir, clean deletes it first."
        required: false
        default: incremental
        type: choice
        options:
          - cache
          - incremental
          - clean
  schedule:
    # Sunday publishes a stable patch; the other days publish a dev prerelease.
    - cron: '30 2 * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write

concurrency:
  group: buddy-mlir-release
  cancel-in-progress: false

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    outputs:
      tag_name: ${{ steps.vars.outputs.tag_name }}
      name: ${{ steps.vars.outputs.name }}
      version: ${{ steps.vars.outputs.version }}
      llvm_cache_mode: ${{ steps.vars.outputs.llvm_cache_mode }}
      is_prerelease: ${{ steps.vars.outputs.is_prerelease }}
      should_release: ${{ steps.vars.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare variables
        id: vars
        run: |
          set -euo pipefail
          git fetch --tags --force origin

          # Get bump type
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            CACHE_MODE="${{ inputs.llvm_cache_mode }}"
            BUMP="${{ inputs.bump }}"
          else
            CACHE_MODE="incremental"
            if [ "$(TZ=Asia/Shanghai date +%u)" = "7" ]; then
              BUMP="patch"
            else
              BUMP="dev"
            fi
          fi

          if [ "${BUMP}" = "dev" ] && [ -n "$(git tag --points-at HEAD --list 'release/v*' 'nightly/v*')" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No commits since the latest release; skipping nightly release."
            exit 0
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"

          # Get latest release version
          LATEST_TAG="$(git tag --list 'release/v*' | sort -V | tail -n 1)"
          LATEST_VERSION="${LATEST_TAG#release/v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST_VERSION}"

          # Get next release version
          if [ "${BUMP}" = "dev" ]; then
            PATCH="$((10#${PATCH} + 1))"
            VERSION="${MAJOR}.${MINOR}.${PATCH}.dev$(TZ=Asia/Shanghai date +%Y%m%d%H%M%S)"

            echo "tag_name=nightly/v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "name=Nightly ${VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Preparing nightly release nightly/v${VERSION}."
          else
            case "${BUMP}" in
              patch) PATCH="$((10#${PATCH} + 1))" ;;
              minor) MINOR="$((10#${MINOR} + 1))"; PATCH=0 ;;
              major) MAJOR="$((10#${MAJOR} + 1))"; MINOR=0; PATCH=0 ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"

            echo "tag_name=release/v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "name=BUDDY MLIR ${VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Preparing ${BUMP} release release/v${VERSION}."
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "llvm_cache_mode=${CACHE_MODE}" >> "$GITHUB_OUTPUT"

      - name: Create or refresh draft release
        uses: softprops/action-gh-release@v2
        if: ${{ steps.vars.outputs.should_release == 'true' }}
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.name }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ steps.vars.outputs.is_prerelease == 'true' }}
          make_latest: false
          append_body: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wheel:
    needs: prepare_release
    if: ${{ needs.prepare_release.outputs.should_release == 'true' }}
    name: Build (${{ matrix.arch }}, py${{ matrix.python }})
    timeout-minutes: 360
    continue-on-error: false

    concurrency:
      group: buddy-mlir-manylinux-${{ matrix.arch }}-py${{ matrix.python }}-${{ needs.prepare_release.outputs.tag_name }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        arch: [x64, riscv64]
        python: ["3.12"]
        include:
          - arch: x64
            target_arch: x86_64
          - arch: riscv64
            target_arch: riscv64

    runs-on:
      - self-hosted-docker
      - ${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'false'

      - name: Prepare variables
        id: vars
        run: |
          set -euo pipefail
          PY_VER="${{ matrix.python }}"
          PY_NODOT="${PY_VER//./}"
          PY_TAG="cp${PY_NODOT}"
          PY_WHEEL_TAG="${PY_TAG}-abi3"
          BUDDY_HASH="$(git rev-parse HEAD)"
          echo "py_tag=${PY_TAG}" >> "$GITHUB_OUTPUT"
          echo "py_wheel_tag=${PY_WHEEL_TAG}" >> "$GITHUB_OUTPUT"
          echo "buddy_hash=${BUDDY_HASH}" >> "$GITHUB_OUTPUT"
          if [[ "${{ matrix.target_arch }}" == "riscv64" ]]; then
            echo "host_build_dir=/data/runner/workspace/buddy-mlir-release" >> "$GITHUB_OUTPUT"
            echo "llvm_src=/data/runner/workspace/llvm-project" >> "$GITHUB_OUTPUT"
          else
            echo "host_build_dir=$HOME/actions-runner/workspace/buddy-mlir-release" >> "$GITHUB_OUTPUT"
            echo "llvm_src=$HOME/actions-runner/workspace/llvm-project" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout LLVM source
        id: setup-llvm
        uses: ./.github/actions/checkout_llvm
        with:
          llvm-src: ${{ steps.vars.outputs.llvm_src }}

      - name: Build manylinux wheel in container
        run: |
          set -euo pipefail
          export LLVM_CACHE_MODE="${{ needs.prepare_release.outputs.llvm_cache_mode }}"
          export HOST_LLVM_SRC="${{ steps.vars.outputs.llvm_src }}"
          export HOST_BUILD_DIR="${{ steps.vars.outputs.host_build_dir }}"
          ./scripts/release.sh "${{ steps.vars.outputs.py_tag }}" "${{ needs.prepare_release.outputs.version }}" "${{ matrix.target_arch }}"

      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BUDDY_BUILD_DIR="${{ steps.vars.outputs.host_build_dir }}/${{ matrix.target_arch }}/buddy/${{ steps.vars.outputs.py_wheel_tag }}/${{ steps.vars.outputs.buddy_hash }}"
          cp -a "${BUDDY_BUILD_DIR}/dist/bin/buddy-cli" "${BUDDY_BUILD_DIR}/target/buddy-cli-${{ needs.prepare_release.outputs.version }}.${{ matrix.target_arch }}"
          gh release upload "${{ needs.prepare_release.outputs.tag_name }}" \
            "${BUDDY_BUILD_DIR}/target/buddy-${{ needs.prepare_release.outputs.version }}-${{ steps.vars.outputs.py_wheel_tag }}-manylinux"* \
            "${BUDDY_BUILD_DIR}/target/llvm-"*"-${{ steps.vars.outputs.py_wheel_tag }}-manylinux"* \
            "${BUDDY_BUILD_DIR}/target/buddy-cli-${{ needs.prepare_release.outputs.version }}.${{ matrix.target_arch }}" \
            --clobber

  publish_release:
    needs: [prepare_release, wheel]
    runs-on: ubuntu-22.04
    steps:
      - name: Publish complete release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare_release.outputs.tag_name }}
          draft: false
          prerelease: ${{ needs.prepare_release.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.prepare_release.outputs.is_prerelease != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
