# Use the exact LLVM tools package Buddy was configured against.
import os

from lit.llvm import llvm_config
from lit.llvm.subst import ToolSubst

if "RISCV" not in config.targets_to_build.split():
    config.unsupported = True

tools = [
    ToolSubst(
        name, command=os.path.join(config.llvm_tools_dir, name + config.llvm_exe_ext)
    )
    for name in ("llvm-as", "llc", "llvm-objdump", "llvm-readelf")
]
llvm_config.add_tool_substitutions(tools, [config.llvm_tools_dir])
